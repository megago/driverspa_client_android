plugins {
    id 'com.android.library'
}

android {
    namespace = "com.todddavies.components.progressbar"
    compileSdk 34

    defaultConfig {
        minSdk 8
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            resources.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }
}

dependencies {
}